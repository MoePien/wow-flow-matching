seed: 7
dataset:
  name: circles
  n_samples: 60000
  n_points: 30
  h_range: 20.0
  y_offset: 10.0
  source_radius: 0.5
  target_radius: 2.0
source:
  type: circles
model:
  in_dim: 2
  time_dim: 32
  hidden_dim: 64
  depth: 2
ot:
  inner: ind
  outer: ind
  method: emd
  reg: 0.05
  sliced_projections: 8
train:
  batch_size: 8
  epochs: 2
  lr: 0.0005
  use_ema: true
  ema_decay: 0.999
  log_every: 200
  vis_every_epochs: 1
  viz_sample_steps: 200
